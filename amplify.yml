version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm i -g pnpm
        - 'pnpm install'
    build:
      commands:
        - env | grep -e API_URL >> .env.production
        - env | grep -e NEXT >> .env.production
        - 'pnpm run build'
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - '.next/cache/**/*'
      - 'node_modules/**/*'
